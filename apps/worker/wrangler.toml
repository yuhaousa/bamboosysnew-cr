name = "bamboosys-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "bamboosys-db"
database_id = "c0f37df7-b388-46ac-980e-59ebc91bf5b2"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bamboosys-media"
preview_bucket_name = "bamboosys-media-preview"

[dev]
port = 8000

[vars]
MEDIA_BASE_URL = "http://localhost:8000/api/media/file"
ADMIN_ORIGIN = "http://localhost:8001"
FRONTEND_ORIGIN = "http://localhost:8002"
ADMIN_EMAIL = "admin@example.com"
ADMIN_PASSWORD = "changeme123"
JWT_SECRET = "8afb04a20613c8a8db4df20778738178f19597e56cf141dc7163bebf8dccd0ad"
